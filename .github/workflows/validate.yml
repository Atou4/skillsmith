name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML for strict frontmatter checks
        run: python3 -m pip install --quiet pyyaml
      - name: Validate skills and plugin manifest
        run: python3 scripts/validate-skills.py
