name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Layout, manifests and frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML for strict frontmatter checks
        run: python3 -m pip install --quiet pyyaml
      - name: Validate skills, plugin manifests, marketplace and vendored notices
        run: python3 scripts/validate-skills.py

  behaviour:
    name: Install routes and scripts
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: skills CLI discovers exactly the repo's skills
        run: RUN_ID=ci .agents/skills/verify-skillsmith/scripts/verify.sh discover
      - name: skill-audit finds every problem in a known-bad fixture
        run: RUN_ID=ci .agents/skills/verify-skillsmith/scripts/verify.sh audit-fixture
      - name: Vendored skills are byte-identical to their pinned upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: RUN_ID=ci .agents/skills/verify-skillsmith/scripts/verify.sh vendor
      - name: Evidence
        if: always()
        run: cat .agents/skills/verify-skillsmith/artifacts/ci/summary.txt .agents/skills/verify-skillsmith/artifacts/ci/failures.txt 2>/dev/null || true
